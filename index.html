<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>pitchlab</title>
    <meta name="description" content="pitchlab is a soccer tactics and coaching studio: draw formations, animate plays on a real timeline, plan drills and analyse shape." />
    <meta name="theme-color" content="#1f4433" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="pitchlab" />
    <meta property="og:description" content="A beautiful, interactive soccer tactics and coaching studio." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pitchlab-studio.vercel.app/og.png" />
    <meta property="og:url" content="https://pitchlab-studio.vercel.app/" />
    <meta name="application-name" content="pitchlab" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pitchlab-theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
          else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
